# Triad - New Category [Partial is replacement of emotes. Total is replacement of emotes and noise when speaking.]
# Emote and speech sound replacement.


# To add a new partial or total replacement trait, use the examples here.
# 
# Replace <Species> with a capitalized name of the species, and <species> with the lowercase version.
# Pull the allowedEmotes from the species yml file. This will replace what emotes someone has available.
# The components of speechSounds, speechVerb, and vocal sounds also should come from the species yml file.


# - type: trait
#   id: FriendsWith<Species>
#   name: trait-vocal-<species>-partial-replacement-name
#   description: trait-vocal-<species>-partial-replacement-desc
#   category: Emotes
#   cost: 0
#   conditions:
#   - !type:IsSpeciesCondition
#     species: <Species>
#     invert: true
#   effects:
#   - !type:OverrideCompsEffect
#     components:
#     - type: Speech
#       allowedEmotes:

# - type: trait
#   id: RaisedBy<Species>
#   name: trait-vocal-<species>-total-replacement-name
#   description: trait-vocal-<species>-total-replacement-desc
#   category: Emotes
#   cost: 0
#   conditions:
#   - !type:IsSpeciesCondition
#     species: <Species>
#     invert: true
#   effects:
#   - !type:OverrideCompsEffect
#     components:
#     - type: Speech
#       speechSounds:
#       speechVerb:
#       allowedEmotes:
#     - type: Vocal
#       sounds:
#         Male:
#         Female:
#         Unsexed:


- type: trait
  id: FriendsWithHarpies
  name: trait-vocal-harpies-partial-replacement-name
  description: trait-vocal-harpies-partial-replacement-desc
  category: Emotes
  cost: 0
  conditions:
  - !type:IsSpeciesCondition
    species: Harpy
    invert: true
  effects:
  - !type:OverrideCompsEffect
    components:
    - type: Speech
      allowedEmotes: ['Meow', 'Hiss', 'Mew', 'Purr', 'Growl', 'Bark', 'Snarl', 'Whine', 'Howl', 'Awoo', 'Honk', 'HarpyRing', 'HarpyPew', 'HarpyBang', 'Beep', 'HarpyRev', 'HarpyCaw', 'Squish', 'Chitter', 'Squeak', 'Click', 'Belch', 'Squish', Bagawk] # Frontier: add Belch, Squish

- type: trait
  id: RaisedByHarpies
  name: trait-vocal-harpies-total-replacement-name
  description: trait-vocal-harpies-total-replacement-desc
  category: Emotes
  cost: 0
  conditions:
  - !type:IsSpeciesCondition
    species: Harpy
    invert: true
  effects:
  - !type:OverrideCompsEffect
    components:
    - type: Speech
      speechSounds: Harpy
      speechVerb: Harpy
      allowedEmotes: ['Meow', 'Hiss', 'Mew', 'Purr', 'Growl', 'Bark', 'Snarl', 'Whine', 'Howl', 'Awoo', 'Honk', 'HarpyRing', 'HarpyPew', 'HarpyBang', 'Beep', 'HarpyRev', 'HarpyCaw', 'Squish', 'Chitter', 'Squeak', 'Click', 'Belch', 'Squish', Bagawk] # Frontier: add Belch, Squish
    - type: Vocal
      sounds:
        Male: SoundsHarpy
        Female: SoundsHarpy
        Unsexed: SoundsHarpy

